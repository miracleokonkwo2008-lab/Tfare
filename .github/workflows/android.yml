name: Package project

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Zip the whole project
        run: |
          mkdir -p dist
          zip -r "dist/klotin-project.zip" . \
            -x ".git/*" "dist/*" "*/build/*" "build/*" ".gradle/*" "*.apk" "*.aab"
          ls -lh dist

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: klotin-project-zip
          path: dist/klotin-project.zip
          if-no-files-found: error
