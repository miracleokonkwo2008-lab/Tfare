name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Unzip the project and find its folder
        run: |
          set -e
          if [ ! -f settings.gradle.kts ]; then
            mkdir -p "$RUNNER_TEMP/unzipped"
            found_zip=0
            for z in *.zip; do
              [ -e "$z" ] || continue
              echo "Unzipping $z"
              unzip -q -o "$z" -d "$RUNNER_TEMP/unzipped"
              found_zip=1
            done
            if [ "$found_zip" = 0 ]; then
              echo "No settings.gradle.kts and no .zip file at the top of the repo." >&2
              ls -la >&2
              exit 1
            fi
            settings=$(find "$RUNNER_TEMP/unzipped" -name settings.gradle.kts -not -path "*/__MACOSX/*" | head -n 1)
            if [ -z "$settings" ]; then
              echo "The zip has no settings.gradle.kts inside it." >&2
              find "$RUNNER_TEMP/unzipped" -maxdepth 3 >&2
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Show the project folder
        run: |
          echo "Building in: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Run unit tests
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest --stacktrace

      - name: Build the debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/out/"
          ls -lh "$RUNNER_TEMP/out"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: klotin-debug-apk
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
